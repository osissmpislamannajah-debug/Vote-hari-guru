<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Dashboard Hasil Voting Guru</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; }
        header p { color: var(--text-muted); }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; background: var(--card-bg); padding: 1rem 1.5rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .status-indicator { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.95rem; color: var(--success); }
        .dot { width: 10px; height: 10px; background-color: var(--success); border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .btn-refresh { background-color: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-refresh:hover { background-color: var(--primary-hover); }

        .grid-container { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        @media(min-width: 768px) {
            .grid-container { grid-template-columns: 1fr 1fr; }
        }

        .section-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .section-box h2 { margin-bottom: 1.25rem; font-size: 1.25rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
        
        .result-item { margin-bottom: 1.2rem; }
        .result-info { display: flex; justify-content: margin-between; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.95rem; }
        .result-info span:last-child { margin-left: auto; color: var(--text-muted); }
        .progress-bar-bg { background-color: #e2e8f0; border-radius: 999px; height: 12px; overflow: hidden; }
        .progress-bar-fill { background-color: var(--primary); height: 100%; width: 0%; transition: width 0.5s ease-in-out; border-radius: 999px; }

        .loading { text-align: center; padding: 3rem; color: var(--text-muted); font-weight: 600; grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📊 Dashboard Hasil Real-Time</h1>
        <p>Pemantauan perolehan suara pemilihan Guru Terbaik & Tergaul</p>
    </header>

    <div class="toolbar">
        <div class="status-indicator">
            <span class="dot"></span> Terhubung ke Database (Auto-refresh tiap 5 detik)
        </div>
        <button class="btn-refresh" onclick="loadRealtimeData()">Muat Ulang Data</button>
    </div>

    <div id="loadingIndicator" class="loading">Memuat data real-time dari database...</div>

    <div class="grid-container">
        <!-- KATEGORI GURU TERBAIK -->
        <div class="section-box" id="boxTerbaik" style="display:none;">
            <h2>🏆 Guru Terbaik <span id="totalTerbaik" style="font-size: 0.9rem; font-weight: normal; color: var(--text-muted);">Total: 0 suara</span></h2>
            <div id="resultsTerbaik"></div>
        </div>

        <!-- KATEGORI GURU TERGAUL -->
        <div class="section-box" id="boxTergaul" style="display:none;">
            <h2>😎 Guru Tergaul <span id="totalTergaul" style="font-size: 0.9rem; font-weight: normal; color: var(--text-muted);">Total: 0 suara</span></h2>
            <div id="resultsTergaul"></div>
        </div>
    </div>
</div>

<script>
    // Menggunakan URL Apps Script aktif Anda yang terakhir
    const API_URL = "https://script.google.com/macros/s/AKfycbzi5ZjX4-U3tjl8tSOx8jBn8U5Y3Ic5k19lqpRTv__MyeD7Oio3QrHJ7cZoQO8_gp2eVQ/exec";

    async function loadRealtimeData() {
        try {
            const response = await fetch(API_URL);
            const appData = await response.json();
            renderAdmin(appData);
            
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('boxTerbaik').style.display = 'block';
            document.getElementById('boxTergaul').style.display = 'block';
        } catch (error) {
            console.error("Gagal memuat data:", error);
            document.getElementById('loadingIndicator').textContent = "Gagal menyambungkan ke database real-time.";
        }
    }

    function renderAdmin(data) {
        // Render Guru Terbaik
        const resTerbaik = document.getElementById('resultsTerbaik');
        resTerbaik.innerHTML = '';
        let totalSuaraTerbaik = data.terbaik.reduce((sum, c) => sum + Number(c.votes), 0);
        document.getElementById('totalTerbaik').textContent = `Total: ${totalSuaraTerbaik} suara`;

        // Urutkan dari suara terbanyak ke terkecil
        let sortedTerbaik = [...data.terbaik].sort((a, b) => Number(b.votes) - Number(a.votes));

        sortedTerbaik.forEach(c => {
            let votes = Number(c.votes);
            let pct = totalSuaraTerbaik === 0 ? 0 : Math.round((votes / totalSuaraTerbaik) * 100);
            resTerbaik.innerHTML += `
                <div class="result-item">
                    <div class="result-info">
                        <span>${c.name}</span>
                        <span>${votes} suara (${pct}%)</span>
                    </div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%"></div></div>
                </div>`;
        });

        // Render Guru Tergaul
        const resTergaul = document.getElementById('resultsTergaul');
        resTergaul.innerHTML = '';
        let totalSuaraTergaul = data.tergaul.reduce((sum, c) => sum + Number(c.votes), 0);
        document.getElementById('totalTergaul').textContent = `Total: ${totalSuaraTergaul} suara`;

        let sortedTergaul = [...data.tergaul].sort((a, b) => Number(b.votes) - Number(b.votes));

        sortedTergaul.forEach(c => {
            let votes = Number(c.votes);
            let pct = totalSuaraTergaul === 0 ? 0 : Math.round((votes / totalSuaraTergaul) * 100);
            resTergaul.innerHTML += `
                <div class="result-item">
                    <div class="result-info">
                        <span>${c.name}</span>
                        <span>${votes} suara (${pct}%)</span>
                    </div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%"></div></div>
                </div>`;
        });
    }

    // Panggil saat halaman pertama kali dibuka
    loadRealtimeData();

    // Fitur Auto-refresh otomatis setiap 5 detik agar benar-benar real-time tanpa perlu manual refresh
    setInterval(loadRealtimeData, 5000);
</script>

</body>
</html>
